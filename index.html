<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ic_app_logo.png" />
    <link rel="apple-touch-icon" href="/ic_app_logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1656D6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LabourBook" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LabourBook - Attendance & Cash Book</title>
    <!-- Google Identity Services (In-app Native One-Tap & Account Chooser) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[SW] ServiceWorker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[SW] ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
