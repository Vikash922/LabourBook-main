name: Build LabourBook Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build React App & Sync Capacitor Android
        run: |
          mkdir -p assets
          cp public/ic_app_logo.png assets/icon.png
          npm install @capacitor/assets --no-save --legacy-peer-deps
          npx @capacitor/assets generate --android

          npm run build
          node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LabourBook-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
